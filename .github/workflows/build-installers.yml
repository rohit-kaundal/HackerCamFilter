name: Build installers

# Run by hand from the Actions tab, or push a tag like v1.0.0 to also publish
# the installers on a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release on tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04      # older glibc = runs on more distros

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system libraries (Qt, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgles2 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 xvfb

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env: { PYTHON: python }
        run: packaging/build_macos.sh

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { PYTHON: python }
        run: packaging\build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env: { PYTHON: python }
        run: packaging/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HackerCam-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
