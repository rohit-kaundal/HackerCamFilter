name: Build installers

# Builds the installers on macOS, Windows and Linux. They're published as a
# GitHub Release (tag v<version>, version from __version__ in app.py) when:
#   - you push a tag like v1.0.2, or
#   - you run it from the Actions tab with "Publish a GitHub Release" ticked.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (tag v<version from app.py>)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release and its tag

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04      # older glibc = runs on more distros

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system libraries (Qt, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgles2 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libpulse0 xvfb

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env: { PYTHON: python }
        run: packaging/build_macos.sh

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { PYTHON: python }
        run: packaging\build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env: { PYTHON: python }
        run: packaging/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HackerCam-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and its tag
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app.py)"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Pushed tag: it must match the version the installers were built with.
            if [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match __version__ ${VERSION} in app.py. Bump the version or fix the tag."
              exit 1
            fi
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            # Run from the Actions tab: never overwrite a published release.
            echo "::error::Release ${TAG} already exists. Bump __version__ in app.py first."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}   # creates the tag here if it doesn't exist
          name: Hacker Cam ${{ steps.tag.outputs.tag }}
          files: installers/*
          generate_release_notes: true
